# Publish the game/ folder as the site root
[build]
  publish = "game"

# Cache image assets for 1 year (they're versioned by filename)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/tiles/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache JS files for 1 hour (they may change between deploys)
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# HTML should always be revalidated
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
